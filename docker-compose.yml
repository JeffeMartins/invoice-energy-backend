name: invoice-energy-backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      POSTGRES_DB: energy_db
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U portfolio -d energy_db"]
      interval: 5s
      retries: 20
  migrate:
    build:
      context: .
      target: build
    command: npm run migrate
    environment:
      DATABASE_URL: postgresql://portfolio:${DB_PASSWORD:?Configure DB_PASSWORD}@db:5432/energy_db
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    ports: ["127.0.0.1:3001:3001"]
    environment:
      DATABASE_URL: postgresql://portfolio:${DB_PASSWORD:?Configure DB_PASSWORD}@db:5432/energy_db
      PORT: 3001
      URL_BASE: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: [uploads:/app/uploads]
volumes:
  postgres-data:
  uploads:
